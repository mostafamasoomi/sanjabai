name: Sanjabai CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio httpx
          pip install -r backend/requirements.txt

      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The live stack is docker-compose.yml. docker-compose.sanjabai.yml
          # is a stale copy that predates the Caddy services — deploying with
          # it brings up a stack with no reverse proxy in front of the app.
          #
          # `up -d` without --no-deps/--no-build also recreates depends_on
          # services and can rebuild an image from the working tree mid-deploy.
          # The order that holds: build the two images, then recreate only
          # those two services from the images just built.
          script: |
            set -euo pipefail
            cd /root/sanjabai
            git pull origin master
            docker compose -f docker-compose.yml build --pull=false sanjabai_frontend sanjabai_api
            docker compose -f docker-compose.yml up -d --no-deps --no-build --force-recreate sanjabai_api sanjabai_frontend
            # Migrations are baked into the image but never run on their own.
            docker exec sanjabai-sanjabai_api-1 python migrate.py
            docker compose -f docker-compose.yml restart sanjabai_bot || true
            echo "✅ Deploy complete"