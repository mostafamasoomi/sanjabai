name: Sanjhubai CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio httpx
          pip install -r backend/requirements.txt

      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # NOTE: this path and the compose file name both assume the
          # server-side checkout has been renamed from /root/multiai to
          # /root/sanjhubai to match this rebrand. If it hasn't been (yet),
          # change just this `cd` line back — don't silently rename the
          # actual directory from a deploy script.
          script: |
            cd /root/sanjhubai
            git pull origin master
            docker compose -f docker-compose.sanjhubai.yml build --pull=false sanjhubai_frontend sanjhubai_api
            docker compose -f docker-compose.sanjhubai.yml up -d sanjhubai_api sanjhubai_frontend
            docker compose -f docker-compose.sanjhubai.yml restart sanjhubai_bot || true
            echo "✅ Deploy complete"