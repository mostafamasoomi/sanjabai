[pytest]
# ── Warning classification (resolved in this branch) ──────────────────────────
#
# The last run before this fix produced 57 warnings, all of which came from
# exactly two root causes.  Both were REAL and were FIXED (not merely
# suppressed):
#
#   1) 55x  DeprecationWarning
#        "The 'app' shortcut is now deprecated. Use the explicit style
#         'transport=...' instead."  (from httpx/_client.py, via
#         starlette.testclient which forwards both `app=` and `transport=`
#         to httpx.Client).
#        FIXED: tests/conftest.py now defines a TestClient subclass that builds
#        the ASGI transport explicitly and forwards only `transport=` to
#        httpx.Client -- the deprecated `app=` shortcut is never used.
#
#   2)  2x  RuntimeWarning
#        "coroutine 'AsyncMockMixin._execute_mock_call' was never awaited"
#        (from app.py:644, the pricing endpoints).
#        ROOT CAUSE: test_admin's create/update pricing tests exercised the
#        pricing endpoint without setting `session._execute_result`.  Reading
#        the unset attribute on an AsyncMock auto-created a child AsyncMock
#        whose `scalar_one()` returned a *coroutine* instead of an int, so
#        `(cur.scalar_one() or 0) + 1` raised TypeError AND left a coroutine
#        un-awaited.
#        FIXED: the mock_async_session fixture now sets a default
#        `session._execute_result` (scalar_one() -> 0) and `session.execute`
#        is a real awaitable coroutine, so every query returns a concrete
#        (non-coroutine) result object.
#
# No *acceptable* warnings remain to be filtered, so nothing is blanket-
# ignored.  Instead, the two categories above are promoted to errors so a
# regression (re-introducing the shortcut or a non-awaitable mock) fails the
# suite loudly rather than silently accumulating warnings again.
filterwarnings =
    error::DeprecationWarning:.*app.*shortcut.*
    error::RuntimeWarning:.*never awaited.*
