services:
  multiai_pg:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: multiai
      POSTGRES_PASSWORD: multiai
      POSTGRES_DB: multiai
    volumes:
      - multiai_pg_data:/var/lib/postgresql/data
      - /root/multiai/infra/pgvector/vector.so:/usr/local/lib/postgresql/vector.so:ro
      # ponytail: no host port needed — API connects via Docker network
    networks: [multiai_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multiai"]
      interval: 10s
      timeout: 5s
      retries: 5

  multiai_redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - multiai_redis_data:/data
    networks: [multiai_net]

  multiai_litellm:
    build:
      context: ./backend
      dockerfile: Dockerfile.litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    volumes:
      - ./backend/litellm_config.yaml:/app/config.yaml:ro
    environment:
      BYNARA_API_KEY: ${BYNARA_API_KEY:?BYNARA_API_KEY must be set in .env}
      BYNARA_API_KEY_2: ${BYNARA_API_KEY_2:?BYNARA_API_KEY_2 must be set in .env}
      SOCKS5_PROXY_URL: ${SOCKS5_PROXY_URL:?SOCKS5_PROXY_URL must be set in .env}
    depends_on:
      - multiai_tunnel
    networks: [multiai_net]

  multiai_tunnel:
    build:
      context: ./infra
      dockerfile: Dockerfile.tunnel
    restart: unless-stopped
    networks: [multiai_net]

  multiai_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      multiai_pg:
        condition: service_healthy
      multiai_redis:
        condition: service_started
      multiai_litellm:
        condition: service_started
      multiai_tunnel:
        condition: service_started
    env_file: .env
    # env vars loaded from .env via env_file above. ADMIN_TOKEN is also
    # required explicitly here (Compose's ${VAR:?msg} syntax) so a missing
    # value fails at `docker compose up` — before the container even
    # starts — rather than only at Python import time inside it
    # (database.py already raises RuntimeError there, but that requires the
    # container to boot first; this is strictly earlier and has no insecure
    # default to fall back to).
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN must be set in .env}
    ports:
      - "0.0.0.0:8001:8000"
    networks: [multiai_net]

  multiai_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://multiai-multiai_api-1:8000
    restart: unless-stopped
    depends_on:
      - multiai_api
    environment:
      NEXT_PUBLIC_API_URL: http://multiai-multiai_api-1:8000
      HOSTNAME: 0.0.0.0
    ports:
      - "0.0.0.0:3003:3000"
    networks: [multiai_net]

  multiai_bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: on-failure:3
    depends_on:
      - multiai_api
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      API_URL: http://multiai-multiai_api-1:8000
    networks: [multiai_net]

volumes:
  multiai_pg_data:
  multiai_redis_data:

networks:
  multiai_net:
    driver: bridge