services:
  multiai_pg:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_USER: multiai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multiai}
      POSTGRES_DB: ${POSTGRES_DB:-multiai}
    volumes:
      - multiai_pg_data:/var/lib/postgresql/data
    networks: [multiai_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multiai"]
      interval: 10s
      timeout: 5s
      retries: 5

  multiai_redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 512m
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - multiai_redis_data:/data
    networks: [multiai_net]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  multiai_litellm:
    build:
      context: ./backend
      dockerfile: Dockerfile.litellm
    restart: unless-stopped
    mem_limit: 2g
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    volumes:
      - ./backend/litellm_config.yaml:/app/config.yaml:ro
    environment:
      BYNARA_API_KEY: ${BYNARA_API_KEY:?BYNARA_API_KEY must be set in .env}
      BYNARA_API_KEY_2: ${BYNARA_API_KEY_2:?BYNARA_API_KEY_2 must be set in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must be set in .env}
      HTTP_PROXY: http://10.10.11.2:8888
      HTTPS_PROXY: http://10.10.11.2:8888
      NO_PROXY: localhost,127.0.0.1,api.exchangerate-api.com,openrouter.ai,api.openrouter.com
    networks: [multiai_net]
    healthcheck:
      test: ['CMD', '/app/.venv/bin/python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:4000/health/liveliness", timeout=10)']
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 30s

  multiai_tunnel:
    build:
      context: ./infra
      dockerfile: Dockerfile.tunnel
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ./infra/ssh_key:/root/.ssh/id_ed25519:ro
    networks: [multiai_net]

  multiai_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      multiai_pg:
        condition: service_healthy
      multiai_redis:
        condition: service_started
      multiai_litellm:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://multiai:${POSTGRES_PASSWORD:-multiai}@multiai_pg:5432/${POSTGRES_DB:-multiai}
      REDIS_URL: redis://multiai_redis:6379/0
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:?ADMIN_PASS must be set in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must be set in .env}
      LITELLM_HOST: http://multiai_litellm:4000
      HTTP_PROXY: http://10.10.11.2:8888
      HTTPS_PROXY: http://10.10.11.2:8888
      NO_PROXY: localhost,127.0.0.1,multiai_litellm,api.exchangerate-api.com,openrouter.ai,api.openrouter.com
    volumes:
      - ./.env:/app/.env:ro
    ports:
      - "0.0.0.0:8081:8000"
    networks: [multiai_net]

  multiai_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://multiai_api:8000
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - multiai_api
    environment:
      NEXT_PUBLIC_API_URL: http://multiai_api:8000
      HOSTNAME: 0.0.0.0
    ports:
      - "0.0.0.0:3003:3000"
    networks: [multiai_net]

  multiai_bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - multiai_api
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      API_URL: http://multiai_api:8000
      HTTP_PROXY: http://10.10.11.2:8888
      HTTPS_PROXY: http://10.10.11.2:8888
    networks: [multiai_net]

volumes:
  multiai_pg_data:
  multiai_redis_data:

networks:
  multiai_net:
    driver: bridge
