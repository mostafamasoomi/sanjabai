services:
  multiai_pg:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: multiai
      POSTGRES_PASSWORD: multiai
      POSTGRES_DB: multiai
    volumes:
      - multiai_pg_data:/var/lib/postgresql/data
    networks: [multiai_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multiai"]
      interval: 10s
      timeout: 5s
      retries: 5

  multiai_redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - multiai_redis_data:/data
    networks: [multiai_net]

  multiai_litellm:
    build:
      context: ./backend
      dockerfile: Dockerfile.litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    volumes:
      - ./backend/litellm_config.yaml:/app/config.yaml:ro
    environment:
      BYNARA_API_KEY: ${BYNARA_API_KEY:?BYNARA_API_KEY must be set in .env}
      BYNARA_API_KEY_2: ${BYNARA_API_KEY_2:?BYNARA_API_KEY_2 must be set in .env}
      SOCKS5_PROXY_URL: ${SOCKS5_PROXY_URL:?SOCKS5_PROXY_URL must be set in .env}
    depends_on:
      - multiai_tunnel
    networks: [multiai_net]

  multiai_tunnel:
    build:
      context: ./infra
      dockerfile: Dockerfile.tunnel
    restart: unless-stopped
    networks: [multiai_net]

  multiai_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      multiai_pg:
        condition: service_healthy
      multiai_redis:
        condition: service_started
      multiai_litellm:
        condition: service_started
      multiai_tunnel:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://multiai:multiai@multiai_pg:5432/multiai}
      REDIS_URL: redis://multiai_redis:6379/0
      MOCK_MODE: "false"
      LITELLM_HOST: http://multiai_litellm:4000
      no_proxy: localhost,127.0.0.1,10.10.11.0/24,172.16.0.0/12,multiai_litellm,multiai_pg,multiai_redis,multiai_api,multiai_frontend,multiai_tunnel
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN must be set in .env}
      API_KEY_PEPPER: ${API_KEY_PEPPER:?API_KEY_PEPPER must be set in .env}
      BASE_URL: ${BASE_URL:-http://localhost:3003}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}
    ports:
      - "127.0.0.1:8001:8000"
    networks: [multiai_net]

  multiai_admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - multiai_api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://multiai:multiai@multiai_pg:5432/multiai}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:?ADMIN_PASS must be set in .env}
    ports:
      - "0.0.0.0:8081:80"
    networks: [multiai_net]

  multiai_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - multiai_api
    environment:
      NEXT_PUBLIC_API_URL: http://multiai-multiai_api-1:8000
      HOSTNAME: 0.0.0.0
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN must be set in .env}
    ports:
      - "0.0.0.0:3003:3000"
    networks: [multiai_net]

  multiai_bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - multiai_api
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      API_URL: http://multiai-multiai_api-1:8000
    networks: [multiai_net]

volumes:
  multiai_pg_data:
  multiai_redis_data:

networks:
  multiai_net:
    driver: bridge