# Explicit project name: Compose defaults the project name (and therefore
# every container's internal DNS name, e.g. <project>-<service>-1) to the
# directory this file lives in. Pinning it here means the container/network
# names below are fixed regardless of what the checkout directory is called
# on any given host — important since this file was renamed as part of the
# Multiai -> Sanjhubai -> Sanjabai rebrands, but the *directory* it's
# deployed from on an existing server may not have been renamed yet (see
# the volume mount below).
name: sanjabai

services:
  sanjabai_pg:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sanjabai
      POSTGRES_PASSWORD: sanjabai
      POSTGRES_DB: sanjabai
    volumes:
      - sanjabai_pg_data:/var/lib/postgresql/data
      # This host path must match wherever this repo is actually checked
      # out on the server. It reads /root/sanjabai here, matching this
      # rebrand — if the real checkout directory hasn't been renamed to
      # match yet, change this one line back to the real path rather than
      # renaming the checkout, and don't fix it silently.
      - /root/sanjabai/infra/pgvector/vector.so:/usr/local/lib/postgresql/vector.so:ro
      # ponytail: no host port needed — API connects via Docker network
    networks: [sanjabai_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanjabai"]
      interval: 10s
      timeout: 5s
      retries: 5

  sanjabai_redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - sanjabai_redis_data:/data
    networks: [sanjabai_net]

  sanjabai_litellm:
    build:
      context: ./backend
      dockerfile: Dockerfile.litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    volumes:
      - ./backend/litellm_config.yaml:/app/config.yaml:ro
    environment:
      BYNARA_API_KEY: ${BYNARA_API_KEY:?BYNARA_API_KEY must be set in .env}
      BYNARA_API_KEY_2: ${BYNARA_API_KEY_2:?BYNARA_API_KEY_2 must be set in .env}
      SOCKS5_PROXY_URL: ${SOCKS5_PROXY_URL:?SOCKS5_PROXY_URL must be set in .env}
    depends_on:
      - sanjabai_tunnel
    networks: [sanjabai_net]

  sanjabai_tunnel:
    build:
      context: ./infra
      dockerfile: Dockerfile.tunnel
    restart: unless-stopped
    networks: [sanjabai_net]

  sanjabai_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      sanjabai_pg:
        condition: service_healthy
      sanjabai_redis:
        condition: service_started
      sanjabai_litellm:
        condition: service_started
      sanjabai_tunnel:
        condition: service_started
    env_file: .env
    # env vars loaded from .env via env_file above. ADMIN_TOKEN is also
    # required explicitly here (Compose's ${VAR:?msg} syntax) so a missing
    # value fails at `docker compose up` — before the container even
    # starts — rather than only at Python import time inside it
    # (database.py already raises RuntimeError there, but that requires the
    # container to boot first; this is strictly earlier and has no insecure
    # default to fall back to).
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN must be set in .env}
    ports:
      - "0.0.0.0:8001:8000"
    networks: [sanjabai_net]

  sanjabai_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://sanjabai-sanjabai_api-1:8000
    restart: unless-stopped
    depends_on:
      - sanjabai_api
    environment:
      NEXT_PUBLIC_API_URL: http://sanjabai-sanjabai_api-1:8000
      HOSTNAME: 0.0.0.0
    ports:
      - "0.0.0.0:3003:3000"
    networks: [sanjabai_net]

  sanjabai_bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: on-failure:3
    depends_on:
      - sanjabai_api
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      API_URL: http://sanjabai-sanjabai_api-1:8000
    networks: [sanjabai_net]

volumes:
  sanjabai_pg_data:
  sanjabai_redis_data:

networks:
  sanjabai_net:
    driver: bridge
