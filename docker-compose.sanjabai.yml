# Explicit project name: Compose defaults the project name (and therefore
# every container's internal DNS name, e.g. <project>-<service>-1) to the
# directory this file lives in. Pinning it here means the container/network
# names below are fixed regardless of what the checkout directory is called
# on any given host — important since this file was renamed as part of the
# Sanjabai -> Sanjabai rebrand, but the *directory* it's deployed from on an
# existing server may not have been renamed yet (see the volume mount below).
name: sanjabai

services:
  sanjabai_pg:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      # ponytail: keep sanjabai user/db to match existing volume data; rename via ALTER USER/DATABASE when safe
      POSTGRES_USER: sanjabai
      POSTGRES_PASSWORD: sanjabai
      POSTGRES_DB: sanjabai
    volumes:
      - sanjabai_pg_data:/var/lib/postgresql/data
    networks: [sanjabai_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanjabai"]
      interval: 10s
      timeout: 5s
      retries: 5

  sanjabai_redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - sanjabai_redis_data:/data
    networks: [sanjabai_net]

  sanjabai_litellm:
    build:
      context: ./backend
      dockerfile: Dockerfile.litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    volumes:
      - ./backend/litellm_config.yaml:/app/config.yaml:ro
    environment:
      BYNARA_API_KEY: ${BYNARA_API_KEY:?BYNARA_API_KEY must be set in .env}
      BYNARA_API_KEY_2: ${BYNARA_API_KEY_2:?BYNARA_API_KEY_2 must be set in .env}
      SOCKS5_PROXY_URL: ${SOCKS5_PROXY_URL:?SOCKS5_PROXY_URL must be set in .env}
      # freellmapi credentials used to be literals inside litellm_config.yaml,
      # which is tracked in a PUBLIC repo. They are env-only now — same pattern
      # as BYNARA_* above. Fail fast rather than start with a broken route.
      FREELLMAPI_API_KEY: ${FREELLMAPI_API_KEY:?FREELLMAPI_API_KEY must be set in .env}
      FREELLMAPI_API_BASE: ${FREELLMAPI_API_BASE:?FREELLMAPI_API_BASE must be set in .env}
    depends_on:
      - sanjabai_tunnel
    networks: [sanjabai_net]

  sanjabai_tunnel:
    build:
      context: ./infra
      dockerfile: Dockerfile.tunnel
    restart: unless-stopped
    environment:
      # The SSH jump host used to be a literal IP baked into Dockerfile.tunnel,
      # published in this PUBLIC repo. It is env-only now; fail fast rather
      # than build a tunnel to nowhere.
      TUNNEL_SSH_HOST: ${TUNNEL_SSH_HOST:?TUNNEL_SSH_HOST must be set in .env}
      TUNNEL_SSH_PORT: ${TUNNEL_SSH_PORT:-22022}
      TUNNEL_SSH_USER: ${TUNNEL_SSH_USER:-root}
    networks: [sanjabai_net]

  sanjabai_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      sanjabai_pg:
        condition: service_healthy
      sanjabai_redis:
        condition: service_started
      sanjabai_litellm:
        condition: service_started
      sanjabai_tunnel:
        condition: service_started
    env_file: .env
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN must be set in .env}
      - SOCKS5_PROXY_URL=${SOCKS5_PROXY_URL:?SOCKS5_PROXY_URL must be set in .env}
      - HTTPS_PROXY=${SOCKS5_PROXY_URL}
      - HTTP_PROXY=${SOCKS5_PROXY_URL}
    ports:
      - "0.0.0.0:8001:8000"
    networks: [sanjabai_net]

  sanjabai_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://sanjabai-sanjabai_api-1:8000
    restart: unless-stopped
    depends_on:
      - sanjabai_api
    environment:
      NEXT_PUBLIC_API_URL: http://sanjabai-sanjabai_api-1:8000
      HOSTNAME: 0.0.0.0
    ports:
      - "0.0.0.0:3003:3000"
    networks: [sanjabai_net]

  sanjabai_bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: on-failure:3
    depends_on:
      - sanjabai_api
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      API_URL: http://sanjabai-sanjabai_api-1:8000
    networks: [sanjabai_net]

volumes:
  sanjabai_pg_data:
  sanjabai_redis_data:

networks:
  sanjabai_net:
    driver: bridge
