# Explicit project name: Compose defaults the project name (and therefore
# every container's internal DNS name, e.g. <project>-<service>-1) to the
# directory this file lives in. Pinning it here means the container/network
# names below are fixed regardless of what the checkout directory is called
# on any given host — important since this file was renamed as part of the
# Sanjabai -> Sanjabai rebrand, but the *directory* it's deployed from on an
# existing server may not have been renamed yet (see the volume mount below).
name: sanjabai

services:
  sanjabai_pg:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      # ponytail: keep sanjabai user/db to match existing volume data; rename via ALTER USER/DATABASE when safe
      POSTGRES_USER: sanjabai
      POSTGRES_PASSWORD: sanjabai
      POSTGRES_DB: sanjabai
    volumes:
      - sanjabai_pg_data:/var/lib/postgresql/data
    networks: [sanjabai_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanjabai"]
      interval: 10s
      timeout: 5s
      retries: 5

  sanjabai_redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - sanjabai_redis_data:/data
    networks: [sanjabai_net]

  sanjabai_litellm:
    build:
      context: ./backend
      dockerfile: Dockerfile.litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    volumes:
      - ./backend/litellm_config.yaml:/app/config.yaml:ro
    environment:
      # The server reaches router.bynara.id directly (verified: HTTP 401 in
      # 0.4s from inside this network with no proxy set), so the SOCKS5 egress
      # tunnel this stack used to need is gone. freellmapi is gone too — it was
      # test-only supply and every one of its 307 catalog rows is 'maintenance'.
      BYNARA_API_KEY: ${BYNARA_API_KEY:?BYNARA_API_KEY must be set in .env}
      BYNARA_API_KEY_2: ${BYNARA_API_KEY_2:?BYNARA_API_KEY_2 must be set in .env}
    networks: [sanjabai_net]

  sanjabai_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      sanjabai_pg:
        condition: service_healthy
      sanjabai_redis:
        condition: service_started
      sanjabai_litellm:
        condition: service_started
    env_file: .env
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN must be set in .env}
      # No HTTP(S)_PROXY here on purpose: outbound is direct now. If a proxy is
      # ever needed again, set HTTP_PROXY/HTTPS_PROXY in .env — do not reinstate
      # a required SOCKS5_PROXY_URL, which made the whole stack refuse to start.
      # Internal-network URL, never an IP: uptime_kuma is not published to the
      # host, so this only ever resolves inside sanjabai_net (compose service
      # DNS). Empty KUMA_STATUS_SLUG default matches status_page.py's own
      # fallback; override both once the status page is created in Kuma.
      - KUMA_BASE_URL=${KUMA_BASE_URL:-http://uptime_kuma:3001}
      - KUMA_STATUS_SLUG=${KUMA_STATUS_SLUG:-sanjabai}
    ports:
      - "0.0.0.0:8001:8000"
    networks: [sanjabai_net]

  sanjabai_watchdog:
    # Financial anomaly watchdog (backend/watchdog.py): 13 SQL rules checked
    # on a loop, with Telegram alerts for CRITICAL/HIGH tiers. Runs the same
    # image as the API, just with a different command -- it needs no ports
    # and talks to pg/redis by their compose service names, same as the API.
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "watchdog.py"]
    restart: unless-stopped
    depends_on:
      sanjabai_pg:
        condition: service_healthy
      sanjabai_redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://sanjabai:sanjabai@sanjabai_pg:5432/sanjabai
      - REDIS_URL=redis://sanjabai_redis:6379/0
      - WATCHDOG_LOG=/tmp/watchdog.log
      # Empty defaults are deliberate: an unconfigured bot token/chat id must
      # not block the container from starting, it should just skip sending
      # (watchdog.py logs a warning and continues -- see _send_telegram).
      - WATCHDOG_BOT_TOKEN=${WATCHDOG_BOT_TOKEN:-}
      - WATCHDOG_CHAT_ID=${WATCHDOG_CHAT_ID:-}
    networks: [sanjabai_net]

  uptime_kuma:
    # Every sanjabai.com component lives on this deploy server -- uptime-kuma
    # is no exception, even though it only monitors things. Not published to
    # the host: Caddy or sanjabai_api reach it over sanjabai_net by service
    # name (see KUMA_BASE_URL above), never by IP or a host port.
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - sanjabai_kuma_data:/app/data
    networks: [sanjabai_net]

  sanjabai_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://sanjabai-sanjabai_api-1:8000
    restart: unless-stopped
    depends_on:
      - sanjabai_api
    environment:
      NEXT_PUBLIC_API_URL: http://sanjabai-sanjabai_api-1:8000
      HOSTNAME: 0.0.0.0
    ports:
      - "0.0.0.0:3003:3000"
    networks: [sanjabai_net]

  sanjabai_bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: on-failure:3
    depends_on:
      - sanjabai_api
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      API_URL: http://sanjabai-sanjabai_api-1:8000
    networks: [sanjabai_net]

volumes:
  sanjabai_pg_data:
  sanjabai_redis_data:
  sanjabai_kuma_data:

networks:
  sanjabai_net:
    driver: bridge
