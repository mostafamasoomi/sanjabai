name: sanjabai

services:
  sanjabai_pg:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sanjabai
      POSTGRES_PASSWORD: sanjabai
      POSTGRES_DB: sanjabai
    volumes:
      - sanjabai_pg_data:/var/lib/postgresql/data
    networks: [sanjabai_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanjabai"]
      interval: 10s
      timeout: 5s
      retries: 5

  sanjabai_redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - sanjabai_redis_data:/data
    networks: [sanjabai_net]

  sanjabai_litellm:
    build:
      context: ./backend
      dockerfile: Dockerfile.litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    volumes:
      - ./backend/litellm_config.yaml:/app/config.yaml:ro
    environment:
      BYNARA_API_KEY: ${BYNARA_API_KEY:?BYNARA_API_KEY must be set in .env}
      BYNARA_API_KEY_2: ${BYNARA_API_KEY_2:?BYNARA_API_KEY_2 must be set in .env}
    networks: [sanjabai_net]

  sanjabai_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      sanjabai_pg:
        condition: service_healthy
      sanjabai_redis:
        condition: service_started
      sanjabai_litellm:
        condition: service_started
    env_file: .env
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN must be set in .env}
    ports:
      - "0.0.0.0:8001:8000"
    networks: [sanjabai_net]

  sanjabai_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://sanjabai-sanjabai_api-1:8000
    restart: unless-stopped
    depends_on:
      - sanjabai_api
    environment:
      NEXT_PUBLIC_API_URL: http://sanjabai-sanjabai_api-1:8000
      HOSTNAME: 0.0.0.0
    ports:
      - "0.0.0.0:3003:3000"
    networks: [sanjabai_net]

  sanjabai_bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: on-failure:3
    depends_on:
      - sanjabai_api
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      API_URL: http://sanjabai-sanjabai_api-1:8000
    networks: [sanjabai_net]

  sanjabai_watchdog:
    # Financial anomaly watchdog (backend/watchdog.py): SQL rules on a loop with
    # optional Telegram alerts. Same image as the API, different command; no
    # ports. NOTE: watchdog.py uses asyncpg.create_pool directly, which rejects
    # the SQLAlchemy "postgresql+asyncpg://" scheme in .env — so DATABASE_URL is
    # set explicitly here to a plain postgresql:// URL, NOT via env_file.
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "watchdog.py"]
    restart: unless-stopped
    depends_on:
      sanjabai_pg:
        condition: service_healthy
      sanjabai_redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://sanjabai:sanjabai@sanjabai_pg:5432/sanjabai
      - REDIS_URL=redis://sanjabai_redis:6379/0
      - WATCHDOG_LOG=/tmp/watchdog.log
      # Empty defaults are deliberate: an unconfigured bot token/chat id must
      # not block startup, watchdog.py just skips sending (see _send_telegram).
      - WATCHDOG_BOT_TOKEN=${WATCHDOG_BOT_TOKEN:-}
      - WATCHDOG_CHAT_ID=${WATCHDOG_CHAT_ID:-}
    networks: [sanjabai_net]

  uptime_kuma:
    # Uptime-Kuma lives on this same deploy server. Not published to the host:
    # the API reaches it over sanjabai_net by service name (KUMA_BASE_URL in
    # .env = http://uptime_kuma:3001), never by IP or a host port.
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - sanjabai_kuma_data:/app/data
    networks: [sanjabai_net]

  sanjabai_caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - sanjabai_frontend
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - sanjabai_caddy_data:/data
      - sanjabai_caddy_config:/config
      - sanjabai_caddy_logs:/var/log/caddy
    networks: [sanjabai_net]

volumes:
  sanjabai_pg_data:
  sanjabai_redis_data:
  sanjabai_caddy_data:
  sanjabai_caddy_config:
  sanjabai_caddy_logs:
  sanjabai_kuma_data:

networks:
  sanjabai_net:
    driver: bridge
