<agent_config>
  <!-- Log collection configuration for multiai -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/kern.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dpkg.log</location>
  </localfile>

  <!-- Application logs: Docker container logs (via journald or docker logs) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/docker/multiai-api.log</location>
  </localfile>

  <!-- Multiai application log directory -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/multiai/*.log</location>
  </localfile>
</agent_config>
